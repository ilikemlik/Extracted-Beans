<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="seyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE9E3"/>
      <stop offset="50%" stop-color="#E5DED6"/>
      <stop offset="100%" stop-color="#D9CFC7"/>
    </linearGradient>
    <linearGradient id="platAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E7C70"/>
      <stop offset="100%" stop-color="#241B16"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" rx="28" fill="url(#seyGrad)"/>
  <rect width="316" height="316" x="2" y="2" rx="26" fill="none" stroke="#C9B59C" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Minimalist Nordic Emblem -->
  <g transform="translate(160, 125)">
    <!-- Thin concentric rings -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#241B16" stroke-width="1.8" opacity="0.8"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#8E7C70" stroke-width="0.8" stroke-dasharray="2,4"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#C9B59C" stroke-width="1.2"/>
    
    <!-- Stylized S Curve -->
    <path d="M16,-22 C-18,-24 -24,-6 0,0 C24,6 18,24 -16,22" fill="none" stroke="#241B16" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-16" cy="22" r="3" fill="#241B16"/>
    <circle cx="16" cy="-22" r="3" fill="#241B16"/>
  </g>

  <!-- Typography -->
  <text x="160" y="235" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#241B16" letter-spacing="6">SEY</text>
  <text x="160" y="258" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="600" fill="#58483E" letter-spacing="3.5">BROOKLYN // NEW YORK</text>
  <text x="160" y="282" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8.5" fill="#8E7C70" letter-spacing="2">SCANDINAVIAN LIGHT ROAST</text>
</svg>
