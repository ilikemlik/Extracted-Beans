<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gdNoir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26282C"/>
      <stop offset="50%" stop-color="#191B1E"/>
      <stop offset="100%" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="gdGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5CF9B"/>
      <stop offset="50%" stop-color="#F1E0B5"/>
      <stop offset="100%" stop-color="#C9AD71"/>
    </linearGradient>
  </defs>

  <!-- Matte Black Bag Background -->
  <rect width="320" height="320" rx="28" fill="url(#gdNoir)"/>
  <rect width="316" height="316" x="2" y="2" rx="26" fill="none" stroke="#C9AD71" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Top Brand Header: GRINDERS COFFEE ROASTERS -->
  <text x="160" y="64" text-anchor="middle" font-family="'Outfit', serif" font-size="30" font-weight="800" fill="#F4F4F6" letter-spacing="3.5">GRINDERS</text>
  <text x="160" y="84" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="700" fill="#D1D5DB" letter-spacing="3.5">COFFEE ROASTERS</text>

  <!-- Gold Series Title: CAFÉ-Q -->
  <text x="160" y="148" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="34" font-weight="800" fill="url(#gdGold)" letter-spacing="4">CAFÉ-Q</text>

  <!-- Gold Specification Box Frame -->
  <g transform="translate(22, 174)">
    <rect x="0" y="0" width="276" height="120" rx="6" fill="none" stroke="url(#gdGold)" stroke-width="1.8"/>
    <!-- Vertical Divider -->
    <line x1="188" y1="0" x2="188" y2="120" stroke="url(#gdGold)" stroke-width="1.5"/>
    <!-- Horizontal Dividers -->
    <line x1="0" y1="44" x2="188" y2="44" stroke="url(#gdGold)" stroke-width="1.5"/>
    <line x1="0" y1="68" x2="188" y2="68" stroke="url(#gdGold)" stroke-width="1.5"/>
    <line x1="188" y1="86" x2="276" y2="86" stroke="url(#gdGold)" stroke-width="1.5"/>

    <!-- Dusty Pink Blend Name: DARKOKO -->
    <text x="94" y="31" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="25" font-weight="800" fill="#E3B3B9" letter-spacing="3">DARKOKO</text>

    <!-- ROAST LEVEL 5/5 Gold Dots -->
    <text x="26" y="60" text-anchor="start" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="700" fill="#E3B3B9" letter-spacing="1.2">ROAST LEVEL</text>
    <g transform="translate(112, 57)">
      <circle cx="0" cy="0" r="4" fill="url(#gdGold)"/>
      <circle cx="11" cy="0" r="4" fill="url(#gdGold)"/>
      <circle cx="22" cy="0" r="4" fill="url(#gdGold)"/>
      <circle cx="33" cy="0" r="4" fill="url(#gdGold)"/>
      <circle cx="44" cy="0" r="4" fill="url(#gdGold)"/>
    </g>

    <!-- STYLE & NOTES -->
    <text x="12" y="84" text-anchor="start" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#E3B3B9" letter-spacing="0.8">STYLE: Strong &amp; Smooth</text>
    <text x="12" y="100" text-anchor="start" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#E3B3B9" letter-spacing="0.8">NOTES: Dark Cocoa, Almond</text>
    <text x="12" y="112" text-anchor="start" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="600" fill="#D1D5DB" letter-spacing="0.5">Dried Fruit &amp; Malt</text>

    <!-- Right Column: Roaster Wheel Emblem + 1kg -->
    <g transform="translate(232, 34)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#E5E7EB" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#E5E7EB" stroke-width="1"/>
      <text x="0" y="30" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9.5" font-weight="800" fill="#F4F4F6" letter-spacing="1">GRINDERS</text>
    </g>
    <text x="232" y="103" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#E3B3B9">1 kg e</text>
    <text x="232" y="114" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#E3B3B9" letter-spacing="0.8">COFFEE BEANS</text>
  </g>
</svg>
