<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262829"/>
      <stop offset="50%" stop-color="#191B1C"/>
      <stop offset="100%" stop-color="#0E1011"/>
    </linearGradient>
    <linearGradient id="nordicSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9CFC7"/>
      <stop offset="100%" stop-color="#8E7C70"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" rx="28" fill="url(#twGrad)"/>
  <rect width="316" height="316" x="2" y="2" rx="26" fill="none" stroke="#D9CFC7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Minimalist Nordic Crosshair / Compass -->
  <g transform="translate(160, 125)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#nordicSilver)" stroke-width="2"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#8E7C70" stroke-width="0.8" stroke-dasharray="3,3"/>
    
    <!-- Stylized T & W intertwined monogram -->
    <line x1="-24" y1="-20" x2="24" y2="-20" stroke="url(#nordicSilver)" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="0" y2="24" stroke="url(#nordicSilver)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-18,-4 L-10,18 L0,0 L10,18 L18,-4" fill="none" stroke="#C9B59C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="160" y="234" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#F9F8F6" letter-spacing="4">TIM WENDELBOE</text>
  <text x="160" y="258" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="600" fill="#D9CFC7" letter-spacing="3.5">GRÜNERLØKKA // OSLO</text>
  <text x="160" y="282" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8.5" fill="#8E7C70" letter-spacing="2">NORDIC ROASTING PIONEER</text>
</svg>
