<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="espNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283548"/>
      <stop offset="60%" stop-color="#1D2736"/>
      <stop offset="100%" stop-color="#131A24"/>
    </linearGradient>
    <linearGradient id="hexCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F0EA"/>
      <stop offset="100%" stop-color="#E4E1D8"/>
    </linearGradient>
  </defs>

  <!-- Deep Navy Matte Bag Background -->
  <rect width="320" height="320" rx="28" fill="url(#espNavy)"/>
  <rect width="316" height="316" x="2" y="2" rx="26" fill="none" stroke="#475569" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Rounded Hexagon Emblem -->
  <g transform="translate(160, 134)">
    <!-- Outer Cream Hexagon -->
    <path d="M0,-102 L88,-52 L88,52 L0,102 L-88,52 L-88,-52 Z" fill="url(#hexCream)" stroke="#F2F0EA" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner Navy Border Hexagon -->
    <path d="M0,-91 L78,-45 L78,45 L0,91 L-78,45 L-78,-45 Z" fill="none" stroke="#223042" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Teal Header: .COFFEE BEANS. -->
    <text x="0" y="-50" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="800" fill="#259C9A" letter-spacing="1.6">· COFFEE BEANS ·</text>

    <!-- Short Top Divider -->
    <rect x="-10" y="-38" width="20" height="3.2" fill="#223042"/>

    <!-- Main Serif Title: Espresso -->
    <text x="0" y="2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#223042" letter-spacing="0.5">Espresso</text>

    <!-- Subhead: COFFEE -->
    <text x="0" y="24" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="700" fill="#223042" letter-spacing="6">COFFEE</text>

    <!-- Short Bottom Divider -->
    <rect x="-10" y="38" width="20" height="3.2" fill="#223042"/>

    <!-- Teal 100% ARABICA -->
    <text x="0" y="58" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="600" fill="#259C9A" letter-spacing="1.2">100% ARABICA</text>
  </g>

  <!-- Bottom Spec Strip (1kg | DARK ROAST 4/5 | WHOLE COFFEE BEANS) -->
  <g transform="translate(0, 256)">
    <line x1="88" y1="-8" x2="88" y2="34" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="202" y1="-8" x2="202" y2="34" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Left: 1kg -->
    <text x="54" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#E2E8F0">1kg</text>

    <!-- Center: DARK ROAST + 4/5 Dots -->
    <text x="145" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1">DARK</text>
    <text x="145" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1">ROAST</text>
    <g transform="translate(145, 28)">
      <circle cx="-20" cy="0" r="3.5" fill="#E2E8F0"/>
      <circle cx="-10" cy="0" r="3.5" fill="#E2E8F0"/>
      <circle cx="0" cy="0" r="3.5" fill="#E2E8F0"/>
      <circle cx="10" cy="0" r="3.5" fill="#E2E8F0"/>
      <circle cx="20" cy="0" r="3" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>
    </g>

    <!-- Right: WHOLE COFFEE BEANS -->
    <text x="252" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">WHOLE</text>
    <text x="252" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">COFFEE</text>
    <text x="252" y="29" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">BEANS</text>
  </g>
</svg>
