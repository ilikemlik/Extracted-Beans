<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="onyxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342D28"/>
      <stop offset="50%" stop-color="#1F1A17"/>
      <stop offset="100%" stop-color="#120E0C"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9CFC7"/>
      <stop offset="50%" stop-color="#C9B59C"/>
      <stop offset="100%" stop-color="#A98F70"/>
    </linearGradient>
    <filter id="onyxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" rx="28" fill="url(#onyxGrad)"/>
  <rect width="316" height="316" x="2" y="2" rx="26" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Geometric Emblem -->
  <g transform="translate(160, 130)">
    <!-- Outer Diamond -->
    <polygon points="0,-70 70,0 0,70 -70,0" fill="none" stroke="url(#goldAcc)" stroke-width="2.5" opacity="0.85"/>
    <polygon points="0,-54 54,0 0,54 -54,0" fill="none" stroke="#D9CFC7" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <!-- Stylized Skull / Monogram facet -->
    <path d="M-22,-24 L22,-24 L32,6 L18,34 L-18,34 L-32,6 Z" fill="none" stroke="url(#goldAcc)" stroke-width="2.5"/>
    <circle cx="-10" cy="2" r="5" fill="#C9B59C"/>
    <circle cx="10" cy="2" r="5" fill="#C9B59C"/>
    <line x1="-12" y1="20" x2="12" y2="20" stroke="#C9B59C" stroke-width="2"/>
    <line x1="-6" y1="20" x2="-6" y2="27" stroke="#C9B59C" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="0" y2="27" stroke="#C9B59C" stroke-width="1.5"/>
    <line x1="6" y1="20" x2="6" y2="27" stroke="#C9B59C" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="160" y="235" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#F9F8F6" letter-spacing="4">ONYX</text>
  <text x="160" y="258" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="600" fill="#C9B59C" letter-spacing="3.5">COFFEE LAB</text>
  <text x="160" y="282" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8.5" fill="#8E7C70" letter-spacing="2">ARKANSAS // USA</text>
</svg>
