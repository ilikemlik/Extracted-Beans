<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="harrisGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9AE6E"/>
      <stop offset="65%" stop-color="#B59652"/>
      <stop offset="100%" stop-color="#8C6F32"/>
    </linearGradient>
    <linearGradient id="harrisNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223867"/>
      <stop offset="100%" stop-color="#162547"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="320" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Golden-Tan Lower Bag Background -->
    <rect width="320" height="320" fill="url(#harrisGold)"/>

    <!-- Top White Border Rim -->
    <rect width="320" height="90" fill="#F4F3EF"/>

    <!-- Iconic Navy Circular Crest -->
    <circle cx="160" cy="68" r="112" fill="url(#harrisNavy)" stroke="#F4F3EF" stroke-width="5"/>

    <!-- "THE ORIGINAL" Curved/Sub Header -->
    <text x="160" y="34" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#E8E9ED" letter-spacing="4">THE ORIGINAL</text>

    <!-- HARRIS Brand Wordmark -->
    <text x="160" y="96" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="52" font-weight="800" fill="#F4F3EF" letter-spacing="2">HARRIS</text>

    <!-- EST 1883 Badge -->
    <text x="118" y="132" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#E8E9ED" letter-spacing="2">EST</text>
    <rect x="128" y="110" width="76" height="30" rx="8" fill="#F4F3EF"/>
    <text x="166" y="132" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#192A4E" letter-spacing="1">1883</text>

    <!-- SMOOTH / BALANCED & CREAMY -->
    <text x="160" y="216" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="30" font-weight="800" fill="#F7F5F0" letter-spacing="3.5">SMOOTH</text>
    <text x="160" y="238" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="700" fill="#F7F5F0" letter-spacing="2.2">BALANCED &amp; CREAMY</text>

    <!-- MEDIUM ROAST + 3/5 Roast Dots -->
    <text x="160" y="268" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#F7F5F0" letter-spacing="2.5">MEDIUM ROAST</text>

    <g transform="translate(160, 286)">
      <circle cx="-36" cy="0" r="6" fill="#F7F5F0"/>
      <circle cx="-18" cy="0" r="6" fill="#F7F5F0"/>
      <circle cx="0" cy="0" r="6" fill="#F7F5F0"/>
      <circle cx="18" cy="0" r="5.2" fill="none" stroke="#F7F5F0" stroke-width="2"/>
      <circle cx="36" cy="0" r="5.2" fill="none" stroke="#F7F5F0" stroke-width="2"/>
    </g>
  </g>

  <rect width="316" height="316" x="2" y="2" rx="26" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.28"/>
</svg>
