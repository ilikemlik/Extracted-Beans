<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="noirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24282E"/>
      <stop offset="50%" stop-color="#16191D"/>
      <stop offset="100%" stop-color="#0E1012"/>
    </linearGradient>
    <linearGradient id="chromeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="dotGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="320" height="320" rx="28" fill="url(#noirBg)"/>
  <rect width="316" height="316" x="2" y="2" rx="26" fill="none" stroke="#6B7280" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Side Hexagonal Molecular Lattice (Echoing the bag packaging side panel) -->
  <g opacity="0.16" stroke="#9CA3AF" stroke-width="1.2" fill="none">
    <polygon points="26,45 44,55 44,75 26,85 8,75 8,55"/>
    <polygon points="26,85 44,95 44,115 26,125 8,115 8,95"/>
    <polygon points="26,125 44,135 44,155 26,165 8,155 8,135"/>
    <circle cx="26" cy="85" r="3.5" fill="#9CA3AF"/>
    <circle cx="44" cy="115" r="3.5" fill="#9CA3AF"/>
    <circle cx="26" cy="165" r="4.5" fill="#9CA3AF"/>
  </g>

  <!-- Caffeine Molecular Structure (1,3,7-trimethylxanthine) -->
  <g transform="translate(160, 118)">
    <!-- 6-Membered Pyrimidinedione Ring -->
    <!-- Vertices: Top-center-left, Top-center-right, Right, Bottom-right, Bottom-left, Left -->
    <!-- Bonds -->
    <path d="M-28,-24 L0,-40 L28,-24 L28,16 L0,32 L-28,16 Z" fill="none" stroke="url(#chromeAccent)" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Internal Double Bonds for 6-ring -->
    <line x1="-22" y1="-21" x2="0" y2="-34" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>
    <line x1="-22" y1="13" x2="-22" y2="-17" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>

    <!-- Fused 5-Membered Imidazole Ring on Right (Sharing edge 28,-24 to 28,16) -->
    <!-- Apex vertex at (60,-4) -->
    <path d="M28,-24 L58,-4 L28,16" fill="none" stroke="url(#chromeAccent)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Imidazole Double Bond -->
    <line x1="33" y1="-18" x2="52" y2="-5" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>

    <!-- Carbonyl Oxygen Bonds (=O) -->
    <!-- Top-left Carbonyl -->
    <line x1="-32" y1="-26" x2="-48" y2="-35" stroke="url(#chromeAccent)" stroke-width="2"/>
    <line x1="-29" y1="-31" x2="-45" y2="-40" stroke="url(#chromeAccent)" stroke-width="1.4"/>
    <!-- Bottom Carbonyl -->
    <line x1="0" y1="32" x2="0" y2="50" stroke="url(#chromeAccent)" stroke-width="2"/>
    <line x1="-4" y1="32" x2="-4" y2="50" stroke="url(#chromeAccent)" stroke-width="1.4"/>

    <!-- Methyl Substituents (-CH3 branches) with Node Atoms -->
    <line x1="0" y1="-40" x2="0" y2="-58" stroke="url(#chromeAccent)" stroke-width="2"/>
    <line x1="-28" y1="16" x2="-48" y2="28" stroke="url(#chromeAccent)" stroke-width="2"/>
    <line x1="58" y1="-4" x2="76" y2="-4" stroke="url(#chromeAccent)" stroke-width="2"/>

    <!-- Atom Nodes / Vertices (Sleek filled circles matching packaging aesthetic) -->
    <circle cx="0" cy="-58" r="4" fill="url(#dotGlow)"/>
    <circle cx="-48" cy="-38" r="4.5" fill="url(#dotGlow)"/>
    <circle cx="0" cy="50" r="4" fill="url(#dotGlow)"/>
    <circle cx="-48" cy="28" r="4" fill="url(#dotGlow)"/>
    <circle cx="76" cy="-4" r="4" fill="url(#dotGlow)"/>

    <circle cx="0" cy="-40" r="3" fill="#D1D5DB"/>
    <circle cx="28" cy="-24" r="3" fill="#D1D5DB"/>
    <circle cx="58" cy="-4" r="3" fill="#D1D5DB"/>
    <circle cx="28" cy="16" r="3" fill="#D1D5DB"/>
    <circle cx="0" cy="32" r="3" fill="#D1D5DB"/>
    <circle cx="-28" cy="16" r="3" fill="#D1D5DB"/>
    <circle cx="-28" cy="-24" r="3" fill="#D1D5DB"/>

    <!-- Molecular Formula Label directly under diagram -->
    <text x="7" y="66" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8.5" font-weight="500" fill="#9CA3AF" letter-spacing="1">Caffeine (C&#8328;H&#8321;&#8320;N&#8324;O&#8322;)</text>
  </g>

  <!-- Typography Hierarchy -->
  <text x="160" y="232" text-anchor="middle" font-family="'Outfit', 'Times New Roman', serif" font-size="25" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">Coffee.</text>
  <text x="160" y="256" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="600" fill="#D1D5DB" letter-spacing="3.5">COFFEE BEANS</text>
  <text x="160" y="280" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8.5" font-weight="500" fill="#9CA3AF" letter-spacing="2">100% AUSTRALIAN ROASTED</text>
</svg>
