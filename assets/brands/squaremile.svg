<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3339"/>
      <stop offset="50%" stop-color="#1E2328"/>
      <stop offset="100%" stop-color="#15181C"/>
    </linearGradient>
    <linearGradient id="tiAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9B59C"/>
      <stop offset="100%" stop-color="#7A818C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" rx="28" fill="url(#sqGrad)"/>
  <rect width="316" height="316" x="2" y="2" rx="26" fill="none" stroke="#7A818C" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Geometric Architectural Emblem -->
  <g transform="translate(160, 125)">
    <!-- Square Mile Grid Motif -->
    <rect x="-48" y="-48" width="96" height="96" fill="none" stroke="url(#tiAccent)" stroke-width="2"/>
    <rect x="-36" y="-36" width="72" height="72" fill="none" stroke="#D9CFC7" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
    <!-- Central Roman Milepost Crosshair -->
    <line x1="-48" y1="0" x2="48" y2="0" stroke="url(#tiAccent)" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="-48" x2="0" y2="48" stroke="url(#tiAccent)" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="14" fill="#1E2328" stroke="#C9B59C" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#C9B59C"/>
  </g>

  <!-- Typography -->
  <text x="160" y="232" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#F9F8F6" letter-spacing="4">SQUARE MILE</text>
  <text x="160" y="256" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="600" fill="#C9B59C" letter-spacing="3.5">COFFEE ROASTERS</text>
  <text x="160" y="280" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8.5" fill="#7A818C" letter-spacing="2">LONDON // UNITED KINGDOM</text>
</svg>
